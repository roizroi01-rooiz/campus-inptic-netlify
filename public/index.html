<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F1B2D">
<meta name="description" content="Plateforme de gestion universitaire pour les filières GI et RT, de la L1 à la L3.">
<title>INPTIC — Gestion universitaire</title>
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="INPTIC">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }
  html { touch-action: pan-x pan-y; }
  button, a, .btn, .pdf-btn, .icon-btn, .notif-btn, .menu-toggle,
  input, select, textarea, .text-input, .auth-tab, .nav a { touch-action: manipulation; }

  :root{
    --navy-950:#0B1524; --navy-900:#0F1B2D; --navy-800:#16233A;
    --navy-700:#1D2E4A; --navy-600:#26374F;
    --line:rgba(255,255,255,0.08); --line-strong:rgba(255,255,255,0.12);
    --ink:#E8ECF2; --ink-dim:#93A3BD; --ink-faint:#5E7191;
    --teal:#3DDC97; --teal-dim:#1E4A3A;
    --gold:#F2B84B; --gold-dim:#4A3B1E;
    --blue:#5B8DEF; --blue-dim:#1E2E4E; --red:#E8637C;
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --sidebar-w:250px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.3);
    --shadow-lg: 0 16px 40px rgba(0,0,0,0.4);
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --fs-xs: clamp(10.5px, 0.7vw + 8.5px, 12px);
    --fs-sm: clamp(11.5px, 0.7vw + 9.5px, 13px);
    --fs-base: clamp(13px, 0.85vw + 10.5px, 15px);
    --fs-md: clamp(14px, 0.85vw + 11.5px, 16px);
    --fs-lg: clamp(15px, 1vw + 12px, 18px);
    --fs-xl: clamp(17px, 1.2vw + 13.5px, 22px);
    --sp-1: clamp(4px, 0.4vw, 6px); --sp-2: clamp(8px, 0.6vw, 10px);
    --sp-3: clamp(12px, 0.8vw, 14px); --sp-4: clamp(14px, 1vw, 18px);
    --sp-5: clamp(18px, 1.2vw, 22px); --sp-6: clamp(22px, 1.5vw, 28px);
    --sp-8: clamp(28px, 2vw, 36px);
    --page-px: clamp(12px, 2.5vw, 28px); --page-py: clamp(16px, 2vw, 26px);
    --radius: clamp(10px, 1vw, 12px); --radius-sm: clamp(7px, 0.7vw, 8px);
  }

  html,body{height:100%;min-height:100%;}
  body{
    margin:0; background:var(--navy-950); color:var(--ink);
    font-family:var(--font-body); font-size:var(--fs-base); line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    padding-left:env(safe-area-inset-left,0px);
    padding-right:env(safe-area-inset-right,0px);
    overflow-x:hidden; width:100%; max-width:100vw;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;letter-spacing:-0.01em;}
  h1{font-size:var(--fs-xl);} h2{font-size:var(--fs-md);} h3{font-size:var(--fs-lg);}
  a{color:inherit;}
  button, input, select, textarea{font-family:inherit; font-size:inherit; color:inherit;}
  table{border-collapse:collapse; width:100%;}
  ::selection{background:var(--blue-dim);}
  img, svg, video { max-width: 100%; height: auto; }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:var(--navy-950);}
  ::-webkit-scrollbar-thumb{background:var(--navy-600);border-radius:4px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  #app{display:flex; min-height:100vh; min-height:100dvh; max-width:100%;}

  .sidebar{
    width:var(--sidebar-w); flex-shrink:0;
    background:var(--navy-900); border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    padding:var(--sp-5) var(--sp-4);
    position:fixed; top:0; left:0; bottom:0;
    padding-top:calc(var(--sp-5) + env(safe-area-inset-top,0px));
    padding-bottom:calc(var(--sp-4) + env(safe-area-inset-bottom,0px));
    transition:transform var(--transition); z-index:40;
    box-shadow: var(--shadow-md); height:100vh; height:100dvh;
    overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  }
  .brand{display:flex; align-items:center; gap:var(--sp-3); padding:0 var(--sp-1) var(--sp-5);}
  .brand-mark{
    width:clamp(38px, 4vw, 46px); height:clamp(38px, 4vw, 46px);
    flex-shrink:0; object-fit:contain; border-radius:var(--radius-sm);
    background:#fff; padding:2px; box-shadow: var(--shadow-sm);
  }
  .brand-text strong{display:block; font-family:var(--font-display); font-size:var(--fs-md); line-height:1.2;}
  .brand-text span{display:block; font-size:var(--fs-xs); color:var(--ink-faint); margin-top:2px;}

  .nav{display:flex; flex-direction:column; gap:2px; flex:1;}
  .nav a{
    display:flex; align-items:center; gap:var(--sp-2);
    padding:var(--sp-3) var(--sp-3);
    border-radius:var(--radius-sm); text-decoration:none;
    color:var(--ink-dim); font-size:var(--fs-base); font-weight:500;
    border-left:2px solid transparent; transition: all var(--transition);
    min-height:44px;
  }
  .nav a svg{width:18px; height:18px; flex-shrink:0; opacity:.85; transition: opacity var(--transition);}
  .nav a:hover{background:var(--navy-800); color:var(--ink);}
  .nav a:hover svg{opacity:1;}
  .nav a.active{background:var(--navy-800); color:var(--ink); border-left-color:var(--blue); box-shadow: inset 0 0 0 1px rgba(91,141,239,0.1);}

  .sidebar-foot{display:flex; flex-direction:column; gap:var(--sp-2); padding-top:var(--sp-3); border-top:1px solid var(--line); margin-top:var(--sp-2);}
  .sidebar-user{
    display:flex; align-items:center; gap:var(--sp-2);
    padding:var(--sp-3) var(--sp-2);
    background:var(--navy-800); border:1px solid var(--line); border-radius:var(--radius-sm);
    margin-bottom:var(--sp-2); transition: border-color var(--transition);
  }
  .sidebar-user .avatar{
    width:34px; height:34px; border-radius:50%; background:var(--blue-dim);
    color:var(--blue); display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:var(--fs-sm); flex-shrink:0;
  }
  .sidebar-user .info{min-width:0; flex:1;}
  .sidebar-user .info strong{display:block; font-size:var(--fs-sm); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sidebar-user .info span{display:block; font-size:var(--fs-xs); color:var(--ink-faint); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .main-wrap{margin-left:var(--sidebar-w); flex:1; min-width:0; display:flex; flex-direction:column; max-width:100%;}

  .topbar{
    display:flex; align-items:center; gap:var(--sp-3);
    padding:var(--sp-4) var(--page-px);
    border-bottom:1px solid var(--line);
    position:sticky; top:0;
    padding-top:calc(var(--sp-4) + env(safe-area-inset-top,0px));
    background:rgba(11,21,36,.75);
    backdrop-filter:blur(12px) saturate(180%);
    -webkit-backdrop-filter:blur(12px) saturate(180%);
    z-index:20; box-shadow: var(--shadow-sm); min-height:56px;
  }
  .menu-toggle{
    display:none; background:none; border:1px solid var(--line); border-radius:var(--radius-sm);
    width:42px; height:42px; align-items:center; justify-content:center; cursor:pointer;
    transition: all var(--transition); flex-shrink:0;
  }
  .menu-toggle:hover{border-color: var(--line-strong); background: var(--navy-800);}
  .menu-toggle svg{width:20px; height:20px;}
  #pageTitle{font-size:var(--fs-lg); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #pageSub{color:var(--ink-faint); font-size:var(--fs-sm); margin-top:2px;}
  .topbar-right{margin-left:auto; display:flex; align-items:center; gap:var(--sp-2); flex-shrink:0;}
  #installBtn{
    background:var(--blue); color:#0B1524; border:none;
    padding:var(--sp-2) var(--sp-3);
    border-radius:var(--radius-sm); font-weight:600; font-size:var(--fs-sm); cursor:pointer;
    transition: all var(--transition); white-space:nowrap;
  }
  #installBtn:hover{filter:brightness(1.1); transform: translateY(-1px);}

  main#view{padding:var(--page-py) var(--page-px) 60px; max-width:1180px; width:100%; margin:0 auto;}

  .panel{
    background:var(--navy-900); border:1px solid var(--line); border-radius:var(--radius);
    padding:var(--sp-4) var(--sp-5); margin-bottom:var(--sp-5);
    box-shadow: var(--shadow-md); transition: border-color var(--transition);
  }
  .panel:hover{border-color: var(--line-strong);}
  .panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--sp-3); gap:var(--sp-2); flex-wrap:wrap;}
  .panel-head h2{font-size:var(--fs-md);}
  .panel-head p{color:var(--ink-faint); font-size:var(--fs-sm); margin-top:3px;}

  .filter-bar{display:flex; gap:var(--sp-2); flex-wrap:wrap; margin-bottom:var(--sp-4); align-items:center;}
  select, .text-input, textarea.text-input{
    background:var(--navy-800); border:1px solid var(--line); color:var(--ink);
    padding:10px var(--sp-3); border-radius:var(--radius-sm); font-size:16px;
    min-width:120px; transition: all var(--transition); max-width:100%;
  }
  textarea.text-input{ min-height: 80px; resize: vertical; width: 100%; font-family: inherit; }
  select:hover, .text-input:hover{border-color: var(--line-strong); background: var(--navy-700);}
  select:focus, .text-input:focus, button:focus-visible, a:focus-visible{
    outline:2px solid var(--blue); outline-offset:1px; border-color: transparent;
  }
  .text-input{min-width:0; width:100%; max-width:280px;}
  .field-row .text-input { min-width: 0; max-width: none; }

  .locked-filter{
    display: inline-flex; align-items: center; gap:6px;
    padding:10px var(--sp-3); background: var(--navy-800);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    font-size:var(--fs-sm); color: var(--ink-dim); line-height:1.4;
  }
  .locked-filter strong { color: var(--ink); font-weight: 600; }

  .btn{
    background:var(--blue); color:#0B1524; border:none;
    padding:10px var(--sp-3); border-radius:var(--radius-sm);
    font-weight:600; font-size:var(--fs-sm); cursor:pointer;
    transition: all var(--transition);
    display: inline-flex; align-items: center; justify-content: center; gap:6px;
    min-height:44px; white-space:nowrap; max-width:100%;
  }
  .btn:hover{filter:brightness(1.1); transform: translateY(-1px);}
  .btn:active{transform: translateY(0);}
  .btn:disabled{opacity:.6; cursor:not-allowed; transform: none;}
  .btn.secondary{background:var(--navy-800); color:var(--ink); border:1px solid var(--line);}
  .btn.secondary:hover{background:var(--navy-700); border-color: var(--line-strong);}
  .btn.danger{background:transparent; color:var(--red); border:1px solid rgba(232,99,124,.4); padding:var(--sp-2) var(--sp-3); font-size:var(--fs-sm);}
  .btn.danger:hover{background: rgba(232,99,124,0.1); border-color: var(--red);}
  .btn.small{padding:var(--sp-2) var(--sp-3); font-size:var(--fs-sm); min-height:38px;}

  table.data th{
    text-align:left; font-size:var(--fs-xs); color:var(--ink-faint);
    font-weight:500; padding:0 var(--sp-2) 10px; border-bottom:1px solid var(--line);
    letter-spacing:.02em; white-space:nowrap;
  }
  table.data td{padding:var(--sp-3) var(--sp-2); border-bottom:1px solid var(--navy-800); font-size:var(--fs-sm); vertical-align:middle;}
  table.data tr:last-child td{border-bottom:none;}
  table.data tr:hover td{background:var(--navy-800);}
  .table-scroll{overflow-x:auto; border-radius: var(--radius-sm); -webkit-overflow-scrolling: touch;}
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}
  .icon-btn{
    background:none; border:1px solid var(--line); color:var(--ink-dim); width:40px; height:40px;
    border-radius:7px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    transition: all var(--transition); flex-shrink:0;
  }
  .icon-btn:hover{color:var(--ink); border-color:var(--blue); background: var(--navy-800); transform: scale(1.05);}
  .icon-btn svg{width:16px; height:16px;}

  .tag{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:var(--fs-xs); font-weight:600; white-space:nowrap;}
  .tag.gi{background:var(--teal-dim); color:var(--teal); border: 1px solid rgba(61,220,151,0.2);}
  .tag.rt{background:var(--gold-dim); color:var(--gold); border: 1px solid rgba(242,184,75,0.2);}

  .empty-state{text-align:center; padding:var(--sp-8) var(--sp-4); color:var(--ink-faint);}
  .empty-state svg{width:34px; height:34px; margin-bottom:12px; opacity:.6;}
  .empty-state p{margin:0 0 14px; font-size:var(--fs-sm);}

  .pdf-row{
    display:flex; align-items:center; gap:var(--sp-3);
    padding:var(--sp-3) var(--sp-4); margin-bottom:var(--sp-2);
    background:var(--navy-800); border:1px solid var(--line);
    border-left: 3px solid transparent; border-radius:var(--radius);
    transition: all var(--transition); flex-wrap: wrap;
  }
  .pdf-row:last-child{margin-bottom:0;}
  .pdf-row:hover{border-color:var(--line-strong); border-left-color: var(--blue); background:var(--navy-700);}
  .pdf-num{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%;
    background:var(--navy-900); border:1px solid var(--line);
    font-size:var(--fs-xs); font-weight:700; color:var(--ink-dim); flex-shrink:0;
  }
  .pdf-icon{
    width:46px; height:46px; border-radius:11px;
    background:linear-gradient(135deg, rgba(96,165,250,.15), rgba(96,165,250,.04));
    border:1px solid rgba(96,165,250,.35);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; color:#60A5FA;
  }
  .pdf-icon svg{width:22px; height:22px;}
  .pdf-meta{flex:1; min-width:0; width: 100%;}
  .pdf-name{font-size:var(--fs-md); font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pdf-commentaire {
    font-size:var(--fs-sm); color: var(--ink-dim);
    background: rgba(91,141,239,0.08); padding: 8px 12px;
    border-radius: 6px; margin: 6px 0;
    border-left: 2px solid var(--blue);
    white-space: pre-wrap; word-break: break-word;
  }
  .pdf-sub{ font-size:var(--fs-xs); color:var(--ink-faint); margin-top:3px; }
  .pdf-actions{display:flex; gap:var(--sp-2); flex-shrink:0; align-items: center; flex-wrap: wrap;}

  .pdf-btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:var(--sp-3) var(--sp-4); border-radius:var(--radius-sm);
    font-size:var(--fs-base); font-weight:600;
    border:1px solid var(--line); background:var(--navy-900);
    color:var(--ink-dim); cursor:pointer;
    transition: all var(--transition); white-space:nowrap;
    min-height:44px;
  }
  .pdf-btn svg{width:17px; height:17px; flex-shrink:0;}
  .pdf-btn:hover{color:var(--ink); border-color:var(--blue); background:var(--navy-800); transform:translateY(-2px);}
  .pdf-btn:active{transform: translateY(0);}
  .pdf-btn.view:hover{ color:var(--blue); border-color:var(--blue); background: rgba(91,141,239,0.1); }
  .pdf-btn.download:hover{ color:var(--teal); border-color:var(--teal); background: rgba(61,220,151,0.1); }
  .pdf-btn.delete:hover{ color:var(--red); border-color:var(--red); background: rgba(232,99,124,0.1); }

  .admin-only-note{font-size:var(--fs-sm); color:var(--ink-faint); margin-top:2px;}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(6,11,20,.75); display:flex; align-items:center;
    justify-content:center; z-index:100; padding:var(--sp-5);
    backdrop-filter: blur(4px); animation: backdropIn 0.2s ease-out;
  }
  @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
  .modal{
    background:var(--navy-900); border:1px solid var(--line-strong); border-radius:var(--radius);
    width:100%; max-width:min(440px, 100%); max-height:88vh; max-height:88dvh;
    overflow-y:auto; padding:var(--sp-6);
    box-shadow: var(--shadow-lg);
    animation: modalIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    -webkit-overflow-scrolling: touch;
  }
  @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal h3{font-size:var(--fs-lg); margin-bottom:4px;}
  .modal .modal-sub{color:var(--ink-faint); font-size:var(--fs-sm); margin-bottom:var(--sp-4);}
  .field{margin-bottom:var(--sp-3);}
  .field label{display:block; font-size:var(--fs-sm); color:var(--ink-dim); margin-bottom:6px;}
  .field select, .field input, .field textarea{width:100%; max-width:none;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-2);}
  .modal-actions{display:flex; justify-content:flex-end; gap:var(--sp-2); margin-top:var(--sp-5); flex-wrap:wrap;}

  #toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#0B1524;
    padding:var(--sp-3) var(--sp-4); border-radius:var(--radius-sm);
    font-size:var(--fs-sm); font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .3s ease, transform .3s ease;
    z-index:200; padding-bottom:calc(var(--sp-3) + env(safe-area-inset-bottom,0px));
    box-shadow: var(--shadow-lg); max-width:calc(100vw - 32px);
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:30;}
  .hidden{display:none !important;}

  /* BANNIÈRE HORS-LIGNE */
  #offlineBanner{
    position:fixed; top:0; left:0; right:0; z-index:9000;
    background:linear-gradient(135deg, #F2B84B, #D99A2B);
    color:#0B1524;
    padding:6px 12px;
    text-align:center;
    font-size:12px; font-weight:700;
    padding-top:calc(8px + env(safe-area-inset-top,0px));
    padding-bottom:8px;
    transform:translateY(-100%);
    transition:transform .35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow:0 2px 12px rgba(0,0,0,.3);
    letter-spacing:.02em;
  }
  #offlineBanner.show{ transform:translateY(0); }
  #offlineBanner .dot{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background:#0B1524; margin-right:6px; vertical-align:middle;
    animation: offlinePulse 1.4s infinite;
  }
  @keyframes offlinePulse{
    0%,100% { opacity:1; }
    50% { opacity:.4; }
  }

  /* ÉCRAN DE DÉMARRAGE */
  #bootScreen{
    position:fixed; inset:0; z-index:9999;
    background:var(--navy-950);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px;
    transition:opacity .3s ease;
  }
  #bootScreen.hide{ opacity:0; pointer-events:none; }
  #bootScreen img{
    width:70px; height:70px; object-fit:contain; border-radius:14px;
    background:#fff; padding:4px; box-shadow:var(--shadow-lg);
    animation: bootFadeIn .5s ease-out;
  }
  #bootScreen .boot-name{
    font-family:var(--font-display); font-size:20px; font-weight:600;
    color:var(--ink); letter-spacing:-.01em;
  }
  #bootScreen .boot-sub{
    font-size:12px; color:var(--ink-faint); margin-top:-14px;
  }
  #bootScreen .boot-spinner{
    width:26px; height:26px; margin-top:10px;
    border:2.5px solid rgba(255,255,255,.1);
    border-top-color:var(--blue); border-radius:50%;

<script>
(function(){
"use strict";

/* =========================================================================
   INDEXEDDB — Cache local persistant
   ========================================================================= */
const DB_NAME = "inptic-offline";
const DB_VERSION = 1;
const DB_STORE = "cache";

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains(DB_STORE)){
        db.createObjectStore(DB_STORE, { keyPath: "key" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbSet(key, value){
  try{
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, "readwrite");
      tx.objectStore(DB_STORE).put({ key, value, updatedAt: Date.now() });
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ console.warn("dbSet error:", e); return false; }
}

async function dbGet(key){
  try{
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, "readonly");
      const req = tx.objectStore(DB_STORE).get(key);
      req.onsuccess = () => resolve(req.result ? req.result.value : null);
      req.onerror = () => reject(req.error);
    });
  }catch(e){ console.warn("dbGet error:", e); return null; }
}

async function dbClear(){
  try{
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, "readwrite");
      tx.objectStore(DB_STORE).clear();
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ return false; }
}

/* =========================================================================
   BANNIÈRE HORS-LIGNE
   ========================================================================= */
function showOfflineBanner(){
  const b = document.getElementById("offlineBanner");
  if(b) b.classList.add("show");
}
function hideOfflineBanner(){
  const b = document.getElementById("offlineBanner");
  if(b) b.classList.remove("show");
}
function updateOfflineState(){
  if(navigator.onLine) hideOfflineBanner();
  else showOfflineBanner();
}

/* =========================================================================
   HELPERS LOCALSTORAGE (backup du cache)
   ========================================================================= */
const LS_USER  = "inptic.cached-user";
const LS_DATA  = "inptic.cached-data";
const LS_YEARS = "inptic.cached-years";

function lsSet(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
function lsGet(key){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function lsClear(){
  try{
    localStorage.removeItem(LS_USER);
    localStorage.removeItem(LS_DATA);
    localStorage.removeItem(LS_YEARS);
  }catch(e){}
}

/* =========================================================================
   API + ÉTAT
   ========================================================================= */
const TOKEN_KEY = "inptic.token";
const MAX_PDF_BYTES = 5 * 1024 * 1024;

const api = {
  token: null,
  load(){ try{ this.token = localStorage.getItem(TOKEN_KEY); }catch(e){ this.token = null; } },
  setToken(t){
    this.token = t || null;
    try{
      if(t) localStorage.setItem(TOKEN_KEY, t);
      else localStorage.removeItem(TOKEN_KEY);
    }catch(e){}
  },
  async raw(method, path, opts){
    opts = opts || {};
    const headers = Object.assign({}, opts.headers || {});
    if(this.token) headers["Authorization"] = "Bearer " + this.token;
    let body = opts.body;
    if(opts.json !== undefined){
      headers["Content-Type"] = "application/json";
      body = JSON.stringify(opts.json);
    }
    let r;
    try{
      r = await fetch("/api" + path, {method, headers, body, cache: "no-store"});
    }catch(e){
      const err = new Error("Connexion impossible. Vérifiez votre accès Internet.");
      err.offline = true;
      throw err;
    }
    if(!r.ok){
      const j = await r.json().catch(()=>({}));
      const err = new Error(j.error || ("Erreur " + r.status));
      err.status = r.status;
      if(r.status === 401 && this.token && path !== "/login"){ this.setToken(null); err.expired = true; }
      throw err;
    }
    return r;
  },
  async call(method, path, opts){
    const r = await this.raw(method, path, opts);
    return r.json();
  },
  async login(email, password){
    const j = await this.call("POST", "/login", {json: {email, password}});
    this.setToken(j.token);
    return j.user;
  },
  async signup(data){
    const j = await this.call("POST", "/signup", {json: data});
    this.setToken(j.token);
    return j.user;
  },
  async fileBlob(id){
    const r = await this.raw("GET", "/docs/" + id + "/file");
    return r.blob();
  }
};

const ROLE_LABEL = {admin:"Admin", etudiant:"Étudiant", enseignant:"Enseignant"};
const FILIERES = ["GI","RT"];
const NIVEAUX = ["L1","L2","L3"];
const FILIERE_LABEL = {GI:"Génie Informatique", RT:"Réseaux &amp; Télécommunications"};

const ANNEES_UNIV = [
  "2026-2027","2027-2028","2028-2029","2029-2030","2030-2031","2031-2032",
  "2032-2033","2033-2034","2034-2035","2035-2036","2036-2037","2037-2038",
  "2038-2039","2039-2040","2040-2041","2041-2042","2042-2043","2043-2044",
  "2044-2045","2045-2046","2046-2047","2047-2048","2048-2049","2049-2050"
];
const ANNEE_DEFAUT = "2026-2027";

function seedState(){
  return { students: [], schedulePdfs: [], notesPdfs: [], resultatPdfs: [], rattrapagePdfs: [], communiquesPdfs: [] };
}
let state = seedState();
let lockedYears = [];

function applyData(d){
  if(!d) return;
  state.students = d.students || [];
  const docs = d.docs || [];
  const byKind = k => docs.filter(x => x.kind === k);
  state.schedulePdfs    = byKind("schedule");
  state.notesPdfs       = byKind("notes");
  state.resultatPdfs    = byKind("resultats");
  state.rattrapagePdfs  = byKind("rattrapage");
  state.communiquesPdfs = byKind("communiques");
}

async function loadLockedYears(){
  try{
    const r = await fetch("/api/locked-years", { cache: "no-store" });
    if(!r.ok){ lockedYears = []; return; }
    const j = await r.json();
    lockedYears = Array.isArray(j.years) ? j.years : [];
  }catch(e){ lockedYears = []; }
}

   CHARGEMENT RÉSEAU + CACHE
   ========================================================================= */
async function fetchAndCache(){
  const j = await api.call("GET", "/me");
  currentUser = j.user;
  await dbSet("user", j.user);
  lsSet(LS_USER, j.user);

  const data = await api.call("GET", "/data");
  applyData(data);
  await dbSet("data", data);
  lsSet(LS_DATA, data);

  await loadLockedYears();
  await dbSet("lockedYears", lockedYears);
  lsSet(LS_YEARS, lockedYears);

  const snapshot = loadDocsSnapshot();
  if(snapshot && currentUser){ notif.detectNewDocs(snapshot); }
  saveDocsSnapshot();
}

async function loadRemote(){
  await fetchAndCache();
}

async function bootAfterAuth(){
  const j = await api.call("GET", "/me");
  currentUser = j.user;
  lsSet(LS_USER, j.user);
  await Promise.all([ loadRemote(), loadLockedYears() ]);
  syncFiltersForStudent();
}

let _syncing = false;
async function syncInBackground(){
  if(_syncing) return;
  if(!navigator.onLine){ updateOfflineState(); return; }
  _syncing = true;
  try{
    await fetchAndCache();
    hideOfflineBanner();
    if(currentUser) renderRoute();
  }catch(err){
    if(err && err.expired){
      hideOfflineBanner();
      handleSessionExpired();
    }else{
      updateOfflineState();
    }
  }finally{
    _syncing = false;
  }
}

  toast("Session expirée. Reconnectez-vous.");
  api.setToken(null);
  currentUser = null;
  state = seedState();
  dbClear();
  lsClear();
  renderAuthScreen();
}

function setAuthError(msg){
  const el = document.getElementById("authError");
  if(el) el.innerHTML = msg ? `<div class="auth-error">${esc(msg)}</div>` : "";
}

function renderAuthScreen(){
  document.getElementById("app").classList.add("hidden");
  const el = document.getElementById("authScreen");
  el.classList.remove("hidden");
  el.innerHTML = authMode==="login" ? loginHtml() : signupHtml();

  el.querySelectorAll("[data-authtab]").forEach(btn => {
    btn.onclick = () => { authMode = btn.dataset.authtab; authSuccessMsg = ""; renderAuthScreen(); };
  });

  if(authMode==="login"){
    const doLogin = async () => {
      const btn = document.getElementById("btnLogin");
      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const pass = document.getElementById("loginPassword").value;
      if(!email || !pass){ setAuthError("Saisissez votre e-mail et votre mot de passe."); return; }
      btn.disabled = true; btn.textContent = "Connexion…";
      try{
        await api.login(email, pass);
        await bootAfterAuth();
        showApp();
      }catch(err){
        btn.disabled = false; btn.textContent = "Se connecter";
        if(err && err.offline){
          setAuthError("Pas de connexion Internet. Connectez-vous une première fois pour activer le mode hors-ligne.");
        }else{
          setAuthError(err.message || "Connexion impossible.");
        }
      }
    };
    document.getElementById("btnLogin").onclick = doLogin;
    document.getElementById("loginPassword").addEventListener("keydown", (e)=>{ if(e.key==="Enter") doLogin(); });
  } else {
    document.getElementById("btnSignup").onclick = async () => {
      const btn = document.getElementById("btnSignup");
      const nom = document.getElementById("suNom").value.trim();
      const prenom = document.getElementById("suPrenom").value.trim();
      const filiere = document.getElementById("suFiliere").value;
      const niveau = document.getElementById("suNiveau").value;
      const annee = document.getElementById("suAnnee").value;
      const email = document.getElementById("suEmail").value.trim().toLowerCase();
      const pass = document.getElementById("suPassword").value;
      const pass2 = document.getElementById("suPassword2").value;

      if(!nom || !prenom || !email){ setAuthError("Merci de remplir tous les champs."); return; }
      if(pass.length < 6){ setAuthError("Le mot de passe doit contenir au moins 6 caractères."); return; }
      if(pass !== pass2){ setAuthError("Les mots de passe ne correspondent pas."); return; }
      if(lockedYears.includes(annee)){
        setAuthError(`L'année universitaire ${annee} est verrouillée. Contactez l'administrateur.`);
        return;
      }

      btn.disabled = true; const label = btn.textContent; btn.textContent = "Création…";
      try{
        await api.signup({nom, prenom, filiere, niveau, annee, email, password: pass});
        await bootAfterAuth();
        showApp();
      }catch(err){
        btn.disabled = false; btn.textContent = label;
        setAuthError(err.message || "Inscription impossible.");
      }
    };
  }
}

function esc(str){
  return String(str==null?"":str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function isAdmin(){ return !!(currentUser && currentUser.role === "admin"); }
function fmtSize(bytes){
  if(bytes < 1024) return bytes + " o";
  if(bytes < 1024*1024) return (bytes/1024).toFixed(0) + " Ko";
  return (bytes/(1024*1024)).toFixed(1) + " Mo";
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("fr-FR", {day:"2-digit", month:"2-digit", year:"numeric"});
}
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> el.classList.remove("show"), 2200);
}

/* ================= PDF.js ================= */
async function loadPdfJsLib(){
  if(window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions && !window.pdfjsLib.GlobalWorkerOptions.workerSrc){
    delete window.pdfjsLib;
  }
  if(window.pdfjsLib) return window.pdfjsLib;
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    script.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      resolve(window.pdfjsLib);
    };
    script.onerror = () => reject(new Error("Impossible de charger PDF.js"));
    document.head.appendChild(script);
  });
}

async function openRemotePdf(pdf){
  if(!api.token){ toast("Session expirée. Reconnectez-vous."); return; }

  const existing = document.getElementById("pdfMobileViewer");
  if(existing) existing.remove();

  const url = "/api/docs/" + encodeURIComponent(pdf.id) + "/file?token=" + encodeURIComponent(api.token);
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

  if(isMobile){
    try { history.pushState({ pdfViewer: true }, ""); } catch(e){}

    const viewer = document.createElement("div");
    viewer.id = "pdfMobileViewer";
    viewer.innerHTML = `
      <div class="pdf-viewer-header">
        <span class="pdf-viewer-title">${esc(pdf.titre || "Document")}</span>
        <button class="pdf-viewer-close" id="closePdfViewerBtn">Fermer</button>
      </div>
      <div id="pdfCanvasContainer" class="pdf-canvas-container">
        <div class="pdf-loading">
          <div class="pdf-spinner"></div>
          <div style="margin-top:12px;font-size:14px;">Chargement du document…</div>
        </div>
      </div>
    `;
    document.body.appendChild(viewer);
    document.body.classList.add("modal-open");

    let closed = false;
    let renderingTask = null;
    let pdfDoc = null;

    const closeViewer = (fromPopstate) => {
      if(closed) return;
      closed = true;
      try { if(renderingTask && renderingTask.cancel) renderingTask.cancel(); } catch(e){}
      try { if(pdfDoc) pdfDoc.destroy(); } catch(e){}
      const el = document.getElementById("pdfMobileViewer");
      if(el) el.remove();
      document.body.classList.remove("modal-open");
      if(!fromPopstate){ try { history.back(); } catch(e){} }
      setTimeout(() => { try { window.focus(); } catch(e){} }, 60);
    };

    document.getElementById("closePdfViewerBtn").onclick = () => closeViewer(false);

    const escHandler = (e) => {
      if(e.key === "Escape"){ closeViewer(false); document.removeEventListener("keydown", escHandler); }
    };
    document.addEventListener("keydown", escHandler);

    const popHandler = () => {
      if(document.getElementById("pdfMobileViewer")){
        closeViewer(true);
        window.removeEventListener("popstate", popHandler);
      }
    };
    window.addEventListener("popstate", popHandler);

    (async () => {
      const container = document.getElementById("pdfCanvasContainer");
      try {
        const pdfjsLib = await loadPdfJsLib();
        const loadingTask = pdfjsLib.getDocument({
          url,
          withCredentials: false,
          disableRange: true,
          disableStream: true,
          disableAutoFetch: true
        });
        pdfDoc = await loadingTask.promise;

        container.innerHTML = "";
        const totalPages = pdfDoc.numPages;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const maxWidth = Math.max(280, container.clientWidth - 20);

        for (let pageNum = 1; pageNum <= totalPages; pageNum++){
          if(closed) return;
          const page = await pdfDoc.getPage(pageNum);
          const baseViewport = page.getViewport({ scale: 1 });
          const scale = maxWidth / baseViewport.width;
          const viewport = page.getViewport({ scale });

          const canvas = document.createElement("canvas");
          canvas.className = "pdf-page-canvas";
          canvas.width = Math.floor(viewport.width * dpr);
          canvas.height = Math.floor(viewport.height * dpr);
          canvas.style.width = Math.floor(viewport.width) + "px";
          canvas.style.height = Math.floor(viewport.height) + "px";

          const ctx = canvas.getContext("2d");
          ctx.scale(dpr, dpr);

          container.appendChild(canvas);

          renderingTask = page.render({ canvasContext: ctx, viewport });
          await renderingTask.promise;
          renderingTask = null;
        }
      } catch(err){
        if(closed) return;
        console.error("PDF render error:", err);
        container.innerHTML = `
          <div style="padding:40px 20px;text-align:center;color:#93A3BD;">
            <div style="font-size:48px;margin-bottom:12px;">📄</div>
            <p style="margin-bottom:20px;font-size:14px;">Impossible d'afficher le document.</p>
            <a href="${url}" target="_blank" rel="noopener" style="background:#5B8DEF;color:#0B1524;padding:12px 20px;border-radius:8px;font-weight:600;text-decoration:none;font-size:14px;">Ouvrir dans un nouvel onglet</a>
          </div>
        `;
      }
    })();

    return;
  }

  const overlay = document.createElement("div");
  overlay.id = "pdfLoaderOverlay";
  overlay.style.cssText = `
    position:fixed; inset:0; z-index:9999;
    background:rgba(11,21,36,.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; color:#E8ECF2; font-family:inherit;
  `;
  overlay.innerHTML = `
    <div style="width:44px;height:44px;border:3px solid rgba(255,255,255,.15);border-top-color:#5B8DEF;border-radius:50%;animation:pdfSpin .8s linear infinite;"></div>
    <div style="font-size:14px;font-weight:600;">Ouverture du document…</div>
    <div style="font-size:12px;color:#93A3BD;">${esc(pdf.titre || "")}</div>
  `;
  if(!document.getElementById("pdfLoaderStyle")){
    const style = document.createElement("style");
    style.id = "pdfLoaderStyle";
    style.textContent = "@keyframes pdfSpin{to{transform:rotate(360deg)}}";
    document.head.appendChild(style);
  }
  document.body.appendChild(overlay);
  const cleanup = () => {
    const el = document.getElementById("pdfLoaderOverlay");
    if(el) el.remove();
  };
  setTimeout(cleanup, 15000);
  const win = window.open(url, "_blank");
  if(!win){ window.location.href = url; cleanup(); }
  else { setTimeout(cleanup, 800); }
}

function preloadRecentPdfs(){
  if(!api.token) return;
  document.querySelectorAll('link[rel="prefetch"][data-inptic-pdf]').forEach(l => l.remove());
  const all = state.schedulePdfs
    .concat(state.notesPdfs, state.resultatPdfs, state.rattrapagePdfs, state.communiquesPdfs)
    .sort((a,b) => b.dateAjout.localeCompare(a.dateAjout))
    .slice(0, 3);
  all.forEach(pdf => {
    const url = "/api/docs/" + encodeURIComponent(pdf.id) + "/file?token=" + encodeURIComponent(api.token);
    if(document.querySelector('link[href="' + url + '"]')) return;
    const link = document.createElement("link");
    link.rel = "prefetch";
    link.href = url;
    link.as = "document";
    link.crossOrigin = "anonymous";
    link.dataset.inpticPdf = "1";
    document.head.appendChild(link);
  });
}

async function markCachedPdfs(){
  if(!("caches" in window) || !api.token) return;
  try {
    const cache = await caches.open("campus-pdf-v1");
    const all = state.schedulePdfs
      .concat(state.notesPdfs, state.resultatPdfs, state.rattrapagePdfs, state.communiquesPdfs);
    for(const pdf of all){
      const hit = await cache.match("/pdf-cache/" + pdf.id);
      if(hit){
        const btn = document.querySelector(`[data-action="open-pdf"][data-id="${pdf.id}"]`);
        if(btn && !btn.querySelector(".pdf-offline-badge")){
          const badge = document.createElement("span");
          badge.className = "pdf-offline-badge";
          badge.textContent = "📥";
          badge.title = "Disponible hors ligne";
          badge.style.cssText = "margin-left:4px;font-size:11px;opacity:.75;";
          btn.appendChild(badge);
        }

function openModal(html, onMount){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.classList.add("modal-open");
  document.getElementById("modalBackdrop").addEventListener("mousedown", (e)=>{
    if(e.target.id === "modalBackdrop") closeModal();
  });
  document.addEventListener("keydown", escCloseOnce);
  if(onMount) onMount(root);
}
function escCloseOnce(e){ if(e.key==="Escape"){ closeModal(); } }
function closeModal(){
  document.getElementById("modalRoot").innerHTML = "";
  document.body.classList.remove("modal-open");
  document.removeEventListener("keydown", escCloseOnce);
}

function pdfUploadModal(kind, filiere, niveau, annee){
  const MAX_BYTES = MAX_PDF_BYTES;
  let cfg;
  if (kind === "notes") cfg = {title:"Ajouter un relevé de notes", placeholder:"ex. Relevé de notes — Semestre 1", doneMsg:"Relevé de notes ajouté"};
  else if (kind === "resultats") cfg = {title:"Ajouter un résultat de semestre", placeholder:"ex. Résultat Semestre 1", doneMsg:"Résultat ajouté"};
  else if (kind === "rattrapage") cfg = {title:"Ajouter un relevé de rattrapage", placeholder:"ex. Relevé de rattrapage — Semestre 1", doneMsg:"Relevé de rattrapage ajouté"};
  else if (kind === "communiques") cfg = {title:"Ajouter un communiqué", placeholder:"ex. Réunion de rentrée 2026", doneMsg:"Communiqué publié"};
  else cfg = {title:"Ajouter l'emploi du temps", placeholder:"ex. Emploi du temps — Semestre 1", doneMsg:"Emploi du temps ajouté"};

  const subTitle = kind === "communiques"
    ? `<p class="modal-sub"> Visible par <strong>tous les étudiants</strong> (toutes filières, tous niveaux)</p>`
    : `<p class="modal-sub">${FILIERE_LABEL[filiere]} · ${niveau} · ${annee}</p>`;

  openModal(`
    <h3>${cfg.title}</h3>
    ${subTitle}
    <div class="field"><label>Fichier PDF</label><input class="text-input" id="f_file" type="file" accept="application/pdf,.pdf"></div>
    <div class="field"><label>Titre affiché</label><input class="text-input" id="f_titre" placeholder="${cfg.placeholder}"></div>
    <div class="field"><label>Message / Commentaire (optionnel)</label><textarea class="text-input" id="f_commentaire" placeholder="Ex: Bonsoir à tous..."></textarea></div>
    <p class="admin-only-note">Taille maximale : 5 Mo.</p>
    <div class="modal-actions">
      <button class="btn secondary" id="f_cancel">Annuler</button>
      <button class="btn" id="f_save">Ajouter</button>
    </div>
  `, (root)=>{
    root.querySelector("#f_cancel").onclick = closeModal;
    root.querySelector("#f_file").addEventListener("change", (e)=>{
      const file = e.target.files[0];
      const titreField = root.querySelector("#f_titre");
      if(file && !titreField.value){ titreField.value = file.name.replace(/\.pdf$/i, ""); }
    });
    root.querySelector("#f_save").onclick = ()=>{
      const file = root.querySelector("#f_file").files[0];
      if(!file){ toast("Choisissez un fichier PDF"); return; }
      const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
      if(!isPdf){ toast("Le fichier doit être un PDF"); return; }
      if(file.size > MAX_BYTES){ toast("Fichier trop volumineux (max 5 Mo)"); return; }
      const titre = root.querySelector("#f_titre").value.trim() || file.name.replace(/\.pdf$/i, "");
      const commentaire = root.querySelector("#f_commentaire").value.trim();
      const saveBtn = root.querySelector("#f_save");
      saveBtn.disabled = true;
      (async () => {
        try{
          const formData = new FormData();
          formData.append("file", file);
          formData.append("kind", kind);
          formData.append("filiere", filiere);
          formData.append("niveau", niveau);
          formData.append("annee", annee || ANNEE_DEFAUT);
          formData.append("titre", titre);
          formData.append("nom", file.name);
          formData.append("commentaire", commentaire);
          await api.call("POST", "/docs", { body: formData });
          await loadRemote();
          closeModal(); renderRoute(); toast(cfg.doneMsg);
        }catch(err){
          saveBtn.disabled = false;
          toast(err.message || "Échec de l'envoi du fichier");
        }
      })();
    };
  });
}

  etudiants:{title:"Étudiants", sub:"Gestion des inscriptions par filière et niveau", render:renderStudents, adminOnly:true},
  notes:{title:"Relevé de notes", sub:"Consultation et dépôt des relevés de notes par filière et niveau", render:renderNotes},
  rattrapage:{title:"Rattrapage", sub:"Consultation et dépôt des relevés de rattrapage", render:renderRattrapage},
  resultats:{title:"Résultat des semestres", sub:"Consultation et dépôt des résultats semestriels", render:renderResultats},
  communiques:{title:"Communiqués", sub:"Annonces officielles de l'INPTIC", render:renderCommuniques},
  emploi:{title:"Emploi du temps", sub:"Planning hebdomadaire par filière et niveau", render:renderEmploi},
  compte:{title:"Mon compte", sub:"Informations personnelles et progression", render:renderCompte}

function currentRoute(){
  const h = location.hash.replace(/^#\/?/, "");
  let route = ROUTES[h] ? h : "emploi";
  if(ROUTES[route].adminOnly && !isAdmin()){
    route = "emploi";
    location.hash = "#/emploi";
  }
  return route;
}

function renderRoute(){
  const route = currentRoute();
  const r = ROUTES[route];
  document.getElementById("pageTitle").textContent = r.title;
  document.getElementById("pageSub").textContent = r.sub;
  document.getElementById("view").innerHTML = r.render();
  document.querySelectorAll(".nav a").forEach(a => {
    a.classList.toggle("active", a.dataset.route === route);
    if(a.dataset.adminOnly === "true") a.style.display = isAdmin() ? "" : "none";
  });
  renderUserChip();
  attachViewHandlers(route);
  closeSidebarMobile();
  renderPushStatus();
  if(route === "emploi" || route === "notes" || route === "resultats" || route === "rattrapage" || route === "communiques"){
    setTimeout(preloadRecentPdfs, 800);
    setTimeout(markCachedPdfs, 1200);
  }
}

function attachViewHandlers(route){
  const view = document.getElementById("view");

  view.onclick = async (e) => {
    if(e.target.id === "btnPassSelf"){
      const annee = e.target.dataset.annee;
      const niveaux = ["L1", "L2", "L3"];
      const student = state.students.find(s => s.id === currentUser.id);
      if(!student){ toast("Profil introuvable"); return; }
      const i = niveaux.indexOf(student.niveau);
      if(i === -1 || i === niveaux.length - 1){ toast("Déjà au niveau max"); return; }
      const nextNiveau = niveaux[i + 1];
      const [a, b] = annee.split("-").map(Number);
      const nextAnnee = `${a + 1}-${b + 1}`;
      if(!confirm(`Confirmer le passage de ${student.niveau} à ${nextNiveau} (${nextAnnee}) ?`)) return;
      e.target.disabled = true; e.target.textContent = "Enregistrement…";
      try{
        const r = await api.call("POST", "/me/pass", {json: {annee}});
        toast(`✅ ${r.ancienNiveau} → ${r.nouveauNiveau} · ${r.nouvelleAnnee}`);
        await loadRemote();
        const me = await api.call("GET", "/me");
        currentUser = me.user;
        lsSet(LS_USER, currentUser);
        syncFiltersForStudent();
        renderRoute();
      }catch(err){
        e.target.disabled = false; e.target.textContent = "✅ Je suis admis";
        toast(err.message || "Échec");
      }
      return;
    }

    if(e.target.id === "btnRepeatSelf"){
      const annee = e.target.dataset.annee;
      const student = state.students.find(s => s.id === currentUser.id);
      if(!student){ toast("Profil introuvable"); return; }
      const [a, b] = annee.split("-").map(Number);
      const nextAnnee = `${a + 1}-${b + 1}`;
      if(!confirm(`Confirmer le redoublement en ${student.niveau} (${student.filiere}) pour l'année ${nextAnnee} ?`)) return;
      e.target.disabled = true;
      const originalLabel = e.target.textContent;
      e.target.textContent = "Enregistrement…";
      try{
        const r = await api.call("POST", "/me/repeat", {json: {annee}});
        toast(`🔁 Redoublement en ${r.niveau || student.niveau} · ${r.nouvelleAnnee || nextAnnee}`);
        await loadRemote();
        const me = await api.call("GET", "/me");
        currentUser = me.user;
        lsSet(LS_USER, currentUser);
        syncFiltersForStudent();
        renderRoute();
      }catch(err){
        e.target.disabled = false; e.target.textContent = originalLabel;
        toast(err.message || "Échec du redoublement");
      }
      return;
    }

    if(e.target.id === "btnEnablePush"){ await enablePushNotifications(); return; }
    if(e.target.id === "btnDisablePush"){ await disablePushNotifications(); return; }

    if(e.target.id === "btnPurgeYear"){
      let annee = ANNEE_DEFAUT;
      if(route === "emploi") annee = uiState.emploi.annee;
      else if(route === "notes") annee = uiState.notes.annee;
      else if(route === "rattrapage") annee = uiState.rattrapage.annee;
      else if(route === "resultats") annee = uiState.resultats.annee;
      purgeYearModal(annee);
      return;
    }

    const btn = e.target.closest("[data-action]");
    if(!btn) return;
    const action = btn.dataset.action;

    if(action==="unlock-year"){
      if(!isAdmin()){ toast("Réservé à l'administrateur"); return; }
      const annee = btn.dataset.annee;
      if(confirm(`Déverrouiller l'année ${annee} ?`)){
        btn.disabled = true;
        try{
          await api.call("DELETE", "/admin/lock-year/" + encodeURIComponent(annee));
          await loadLockedYears();
          await dbSet("lockedYears", lockedYears);
          lsSet(LS_YEARS, lockedYears);
          renderRoute();
          toast(`✅ Année ${annee} déverrouillée`);
        }catch(err){
          btn.disabled = false;
          toast(err.message || "Échec du déverrouillage");
        }
      }
      return;
    }

    if(action==="delete-student"){
      if(confirm("Supprimer cet étudiant ? Son compte sera aussi supprimé.")){
        try{
          await api.call("DELETE", "/students/" + btn.dataset.id);
          await loadRemote(); renderRoute(); toast("Étudiant supprimé");
        }catch(err){ toast(err.message || "Suppression impossible"); }
      }
    } else if(action==="open-pdf"){
      const kind = btn.dataset.kind, id = btn.dataset.id;
      let pdf;
      if (kind === "notes") pdf = state.notesPdfs.find(x => x.id === id);
      else if (kind === "resultats") pdf = state.resultatPdfs.find(x => x.id === id);
      else if (kind === "rattrapage") pdf = state.rattrapagePdfs.find(x => x.id === id);
      else if (kind === "communiques") pdf = state.communiquesPdfs.find(x => x.id === id);
      else pdf = state.schedulePdfs.find(x => x.id === id);
      if (pdf) openRemotePdf(pdf);
    } else if(action==="download-pdf"){
      const kind = btn.dataset.kind;
      const list = kind==="notes" ? state.notesPdfs
                 : kind==="resultats" ? state.resultatPdfs
                 : kind==="rattrapage" ? state.rattrapagePdfs
                 : kind==="communiques" ? state.communiquesPdfs
                 : state.schedulePdfs;
      const pdf = list.find(x => x.id === btn.dataset.id);
      if (pdf) downloadRemotePdf(pdf);
    } else if(action==="delete-pdf"){
      if(!isAdmin()){ toast("Réservé à l'administrateur"); return; }
      let label;
      if (btn.dataset.kind === "notes") label = "relevé de notes";
      else if (btn.dataset.kind === "resultats") label = "résultat";
      else if (btn.dataset.kind === "rattrapage") label = "relevé de rattrapage";
      else if (btn.dataset.kind === "communiques") label = "communiqué";
      else label = "emploi du temps";
      if(confirm(`Supprimer ce ${label} ?`)){
        try{
          await api.call("DELETE", "/docs/" + btn.dataset.id);
          await loadRemote(); renderRoute();
          toast(label.charAt(0).toUpperCase()+label.slice(1)+" supprimé");
        }catch(err){ toast(err.message || "Suppression impossible"); }
      }
    }
  };

  view.onchange = (e) => {
    const t = e.target;
    if(t.id==="fStudFiliere"){ uiState.students.filiere = t.value; renderRoute(); }
    else if(t.id==="fStudNiveau"){ uiState.students.niveau = t.value; renderRoute(); }
    else if(t.id==="fNoteFiliere"){ uiState.notes.filiere = t.value; renderRoute(); }
    else if(t.id==="fNoteNiveau"){ uiState.notes.niveau = t.value; renderRoute(); }
    else if(t.id==="fNoteAnnee"){ uiState.notes.annee = t.value; renderRoute(); }
    else if(t.id==="fRatFiliere"){ uiState.rattrapage.filiere = t.value; renderRoute(); }
    else if(t.id==="fRatNiveau"){ uiState.rattrapage.niveau = t.value; renderRoute(); }
    else if(t.id==="fRatAnnee"){ uiState.rattrapage.annee = t.value; renderRoute(); }
    else if(t.id==="fResFiliere"){ uiState.resultats.filiere = t.value; renderRoute(); }
    else if(t.id==="fResNiveau"){ uiState.resultats.niveau = t.value; renderRoute(); }
    else if(t.id==="fResAnnee"){ uiState.resultats.annee = t.value; renderRoute(); }
    else if(t.id==="fEmpFiliere"){ uiState.emploi.filiere = t.value; renderRoute(); }
    else if(t.id==="fEmpNiveau"){ uiState.emploi.niveau = t.value; renderRoute(); }
    else if(t.id==="fEmpAnnee"){ uiState.emploi.annee = t.value; renderRoute(); }
  };

  view.oninput = (e) => {
    if(e.target.id==="fStudSearch"){
      uiState.students.q = e.target.value;
      renderStudentsListOnly();
    }
  };

  if(route==="emploi" && isAdmin()){
    const btn = document.getElementById("btnAddPdf");
    if(btn) btn.onclick = ()=> pdfUploadModal("schedule", uiState.emploi.filiere, uiState.emploi.niveau, uiState.emploi.annee);
  }
  if(route==="notes" && isAdmin()){
    const btn = document.getElementById("btnAddNotePdf");
    if(btn) btn.onclick = ()=> pdfUploadModal("notes", uiState.notes.filiere, uiState.notes.niveau, uiState.notes.annee);
  }
  if(route==="rattrapage" && isAdmin()){
    const btn = document.getElementById("btnAddRattrapagePdf");
    if(btn) btn.onclick = ()=> pdfUploadModal("rattrapage", uiState.rattrapage.filiere, uiState.rattrapage.niveau, uiState.rattrapage.annee);
  }
  if(route==="resultats" && isAdmin()){
    const btn = document.getElementById("btnAddResultatPdf");
    if(btn) btn.onclick = ()=> pdfUploadModal("resultats", uiState.resultats.filiere, uiState.resultats.niveau, uiState.resultats.annee);
  }
  if(route==="communiques" && isAdmin()){
    const btn = document.getElementById("btnAddCommunique");
    if(btn) btn.onclick = ()=> pdfUploadModal("communiques", "TOUTES", "TOUS", "TOUTES");
    const btnPurge = document.getElementById("btnPurgeCommuniques");
    if(btnPurge) btnPurge.onclick = ()=> purgeCommuniquesModal();
  }
}

function syncAppBadge(count){
  if("setAppBadge" in navigator){
    if(count > 0) navigator.setAppBadge(count).catch(()=>{});
    else navigator.clearAppBadge().catch(()=>{});
  }
  if("serviceWorker" in navigator && navigator.serviceWorker.controller){
    try{ navigator.serviceWorker.controller.postMessage({ type: "set-badge", count: count }); }catch(e){}
  }
  if(count === 0 && api.token){ api.call("POST", "/me/clear-badge").catch(()=>{}); }
}

const NOTIF_KEY = "inptic.notifs";
const NOTIF_PERM_KEY = "inptic.notifPermAsked";
const NOTIF_AUTO_CLEAR_MS = 5 * 1000;

const notif = {
  items: [], panelOpen: false, _autoClearTimer: null,
  load(){ try{ this.items = JSON.parse(localStorage.getItem(NOTIF_KEY) || "[]"); }catch(e){ this.items = []; } },
  save(){ try{ localStorage.setItem(NOTIF_KEY, JSON.stringify(this.items.slice(0, 50))); }catch(e){} },
  add({ id, title, text, url, time }){
    if(!id) id = "n-" + Date.now();
    if(this.items.some(n => n.id === id)) return;
    this.items.unshift({ id, title, text, url: url || "#/emploi", time: time || new Date().toISOString(), read: false });
    this.items = this.items.slice(0, 50);
    this.save(); this.renderBadge();
    if(this.panelOpen) this.renderPanel();
  },
  markAllRead(){
    this.items.forEach(n => n.read = true);
    this.save(); this.renderBadge();
    if(this.panelOpen) this.renderPanel();
    syncAppBadge(this.unreadCount());
  },
  markRead(id){
    const n = this.items.find(x => x.id === id);
    if(n){ n.read = true; this.save(); this.renderBadge(); }
    syncAppBadge(this.unreadCount());
  },
  unreadCount(){ return this.items.filter(n => !n.read).length; },
  renderBadge(){
    const badge = document.getElementById("notifBadge");
    if(!badge) return;
    const count = this.unreadCount();
    if(count === 0) badge.classList.add("hidden");
    else { badge.classList.remove("hidden"); badge.textContent = count > 99 ? "99+" : count; }
    syncAppBadge(count);
  },
  togglePanel(){
    const root = document.getElementById("notifPanelRoot");
    if(!root) return;
    if(this.panelOpen){
      root.innerHTML = "";
      document.body.classList.remove("modal-open");
      this.panelOpen = false;
      if(this._autoClearTimer){ clearTimeout(this._autoClearTimer); this._autoClearTimer = null; }
      return;
    }
    this.renderPanel();
    document.body.classList.add("modal-open");
    this.panelOpen = true;
    if(this._autoClearTimer) clearTimeout(this._autoClearTimer);
    this._autoClearTimer = setTimeout(() => {
      this.items = [];
      this.save(); this.renderBadge(); syncAppBadge(0);
      const r = document.getElementById("notifPanelRoot");
      if(r) r.innerHTML = "";
      document.body.classList.remove("modal-open");
      this.panelOpen = false; this._autoClearTimer = null;
      toast("Notifications effacées");
    }, NOTIF_AUTO_CLEAR_MS);
  },
  renderPanel(){
    const root = document.getElementById("notifPanelRoot");
    if(!root) return;
    const list = this.items.slice(0, 20);
    const itemsHtml = list.length
      ? list.map(n => `
        <div class="notif-item ${n.read ? "read" : "unread"}" data-notif-id="${esc(n.id)}" data-notif-url="${esc(n.url)}">
          <span class="notif-dot"></span>
          <div class="notif-body">
            <div class="notif-title">${esc(n.title)}</div>
            <div class="notif-text">${esc(n.text)}</div>
            <div class="notif-time">${fmtRelativeTime(n.time)}</div>
          </div>
        </div>`).join("")
      : `<div class="notif-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><div>Aucune notification</div></div>`;
    root.innerHTML = `
      <div class="notif-panel" id="notifPanel">
        <div class="notif-panel-head">
          <h3>Notifications</h3>
          <div style="display:flex;gap:8px;align-items:center;">
            ${this.items.length ? `<button id="notifMarkAll">Tout lire</button>` : ""}
            <button id="notifClose" class="notif-close-btn" aria-label="Fermer">✕</button>
          </div>
        </div>
        <div class="notif-list">${itemsHtml}</div>
      </div>`;
    const markAll = root.querySelector("#notifMarkAll");
    if(markAll) markAll.onclick = (e) => { e.stopPropagation(); this.markAllRead(); };
    const closeBtn = root.querySelector("#notifClose");
    if(closeBtn) closeBtn.onclick = (e) => { e.stopPropagation(); this.togglePanel(); };
    root.querySelectorAll("[data-notif-id]").forEach(el => {
      el.onclick = () => {
        this.markRead(el.dataset.notifId);
        if(el.dataset.notifUrl){
          if(el.dataset.notifUrl.startsWith("#")) location.hash = el.dataset.notifUrl;
          else window.open(el.dataset.notifUrl, "_blank");
        }
        this.togglePanel();
      };
    });
  },
  detectNewDocs(previousDocs){
    if(!previousDocs) return;
    const prevIds = new Set(previousDocs.map(d => d.id));
    const fresh = state.schedulePdfs
      .concat(state.notesPdfs, state.resultatPdfs, state.rattrapagePdfs, state.communiquesPdfs)
      .filter(d => !prevIds.has(d.id));
    const KIND_LABEL = { schedule: "Emploi du temps", notes: "Relevé de notes", resultats: "Résultat de semestre", rattrapage: "Relevé de rattrapage", communiques: "Nouveau communiqué" };
    fresh.forEach(doc => {
      const label = KIND_LABEL[doc.kind] || "Nouveau document";
      const suffix = doc.filiere && doc.filiere !== "TOUTES" ? ` · ${doc.filiere} ${doc.niveau}` : "";
      const url = "#/" + (doc.kind === "schedule" ? "emploi" : doc.kind);
      this.add({ id: "doc-" + doc.id, title: label, text: doc.titre + suffix, url });
    });
  },
  async requestPermission(){
    if(!("Notification" in window)) return false;
    if(Notification.permission === "granted") return true;
    if(Notification.permission === "denied") return false;
    try{ const p = await Notification.requestPermission(); return p === "granted"; }
    catch(e){ return false; }
  }
};

function fmtRelativeTime(iso){
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if(diff < 60) return "à l'instant";
  if(diff < 3600) return `il y a ${Math.floor(diff/60)} min`;
  if(diff < 86400) return `il y a ${Math.floor(diff/3600)} h`;
  if(diff < 604800) return `il y a ${Math.floor(diff/86400)} j`;
  return new Date(iso).toLocaleDateString("fr-FR");
}

function urlBase64ToUint8Array(base64String){
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function getVapidPublicKey(){
  try{
    const r = await fetch("/api/push/vapid-public-key", { cache: "no-store" });
    if(!r.ok) return null;
    const j = await r.json();
    return j.publicKey || null;
  }catch(e){ return null; }
}

async function subscribePushIfPossible(){
  try{
    if(!("serviceWorker" in navigator) || !("PushManager" in window)) return;
    if(Notification.permission !== "granted") return;
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(sub){
      await api.call("POST", "/push/subscribe", { json: { subscription: sub.toJSON() } }).catch(()=>{});
      return;
    }
    const publicKey = await getVapidPublicKey();
    if(!publicKey) return;
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey)
    });
    await api.call("POST", "/push/subscribe", { json: { subscription: sub.toJSON() } });
  }catch(e){ console.warn("Subscribe push failed:", e.message); }
}

async function enablePushNotifications(){
  try{
    if(!("Notification" in window)){ toast("Notifications non supportées"); return; }
    if(!("serviceWorker" in navigator)){ toast("Service Worker non disponible"); return; }
    if(!("PushManager" in window)){ toast("Push non supporté"); return; }
    const granted = await notif.requestPermission();
    if(!granted){ toast("Permission refusée"); renderPushStatus(); return; }
    await subscribePushIfPossible();
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(sub) toast("Notifications push activées ✅");
    else toast("Abonnement échoué");
    renderPushStatus();
  }catch(e){ toast("Erreur : " + (e.message || e)); renderPushStatus(); }
}

async function disablePushNotifications(){
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(sub){
      await api.call("POST", "/push/unsubscribe", { json: { endpoint: sub.endpoint } }).catch(()=>{});
      await sub.unsubscribe();
    }
    toast("Notifications push désactivées");
    renderPushStatus();
  }catch(e){ toast("Erreur lors de la désactivation"); }
}

function renderPushStatus(){
  const el = document.getElementById("pushStatus");
  if(!el) return;
  const supported = "Notification" in window && "PushManager" in window && "serviceWorker" in navigator;
  const perm = supported ? Notification.permission : "unsupported";
  if(!supported){ el.innerHTML = `<div class="notif-perm-banner">⚠️ Votre navigateur ne supporte pas les notifications push.</div>`; return; }
  if(perm === "granted"){
    el.innerHTML = `<div class="notif-perm-banner" style="border-color:rgba(61,220,151,.3); background:rgba(61,220,151,.08); color:var(--teal);">✅ Notifications push activées.<button id="btnDisablePush" style="background:var(--navy-800); color:var(--ink); margin-left:auto;">Désactiver</button></div>`;
  } else if(perm === "denied"){
    el.innerHTML = `<div class="notif-perm-banner" style="border-color:rgba(232,99,124,.3); background:rgba(232,99,124,.08); color:var(--red);">❌ Notifications bloquées.</div>`;
  } else {
    el.innerHTML = `<div class="notif-perm-banner">🔔 Activez les notifications.<button id="btnEnablePush" style="margin-left:auto;">Activer</button></div>`;
  }
}

async function askNotifPermissionOnce(){
  try{
    if(localStorage.getItem(NOTIF_PERM_KEY)) return;
    if(!("Notification" in window)) return;
    if(Notification.permission === "default"){
      await new Promise(r => setTimeout(r, 3000));
      const granted = await notif.requestPermission();
      localStorage.setItem(NOTIF_PERM_KEY, "1");
      if(granted){ toast("Notifications activées ✅"); await subscribePushIfPossible(); }
    }
  }catch(e){}
}

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").then((reg)=>{
      document.addEventListener("visibilitychange", ()=>{
        if(document.visibilityState === "visible") reg.update().catch(()=>{});
      });
    }).catch((e) => console.warn("SW register error:", e));
  });
  let swRefreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(swRefreshing || !navigator.serviceWorker.controller) return;
    swRefreshing = true;
    toast("Mise à jour installée");
    setTimeout(()=> location.reload(), 900);
  });
  navigator.serviceWorker.addEventListener("message", (e)=>{
    if(e.data && e.data.type === "push-received"){ notif.add(e.data.notif || {}); }
  });
}

/* =========================================================================
   DÉMARRAGE — OFFLINE-FIRST AVEC DOUBLE CACHE (IndexedDB + localStorage)
   ========================================================================= */
(async function boot(){
  api.load();

  const hasToken = !!api.token;
  let cachedUser = null;
  let cachedData = null;
  let cachedYears = null;

  // Étape 1 : Lecture du cache — localStorage en priorité (plus rapide)
  try {
    cachedUser = lsGet(LS_USER);
    cachedData = lsGet(LS_DATA);
    cachedYears = lsGet(LS_YEARS);
  } catch(e){}

  // Fallback IndexedDB si localStorage vide
  if (!cachedUser) { try { cachedUser = await dbGet("user"); } catch(e){} }
  if (!cachedData) { try { cachedData = await dbGet("data"); } catch(e){} }
  if (!cachedYears){ try { cachedYears = await dbGet("lockedYears"); } catch(e){} }

  const hasCache = !!(cachedUser && cachedData);

  // CAS 1 : Token + cache → affichage instantané, sync en arrière-plan
  if (hasToken && hasCache) {
    currentUser = cachedUser;
    applyData(cachedData);
    lockedYears = Array.isArray(cachedYears) ? cachedYears : [];
    showApp();
    if (navigator.onLine) syncInBackground();
    else showOfflineBanner();
    return;
  }

  // CAS 2 : Token mais pas de cache → sync obligatoire
  if (hasToken) {
    if (navigator.onLine) {
      try {
        await fetchAndCache();
        showApp();
        return;
      } catch(err) {
        if (err && err.offline) {
          showApp();
          showOfflineBanner();
          return;
        }
        if (err && err.expired) {
          hideBootScreen();
          renderAuthScreen();
          setAuthError("Session expirée. Reconnectez-vous.");
          return;
        }
        hideBootScreen();
        renderAuthScreen();
        setAuthError("Erreur de connexion. Réessayez.");
        return;
      }
    }
    hideBootScreen();
    renderAuthScreen();
    return;
  }

  // CAS 3 : Pas de token → écran de connexion
  hideBootScreen();
  renderAuthScreen();
})();

setTimeout(hideBootScreen, 4000);

})();
